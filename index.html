
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153f68">
<title>SjukhusSystem Sverige</title>
<style>
:root {
  --navy:#153f68;--blue:#246da2;--bg:#f1f5fa;
  --ink:#203247;--muted:#68798b;--line:#dce5ee;
  --green:#16794b;--red:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:white;padding:20px}
header h1{margin:0 0 7px;font-size:24px}
header p{margin:0;color:#d4e3f2}
main{max-width:1200px;margin:auto;padding:16px}
.panel,.stat{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #193b5b0b}
.hidden{display:none!important}
.notice{background:#fff8e6;padding:14px;border:1px solid #f1d48a;border-radius:12px;margin-bottom:16px;line-height:1.5}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd7e3;border-radius:9px;font:inherit;margin:5px 0 12px}
textarea{min-height:85px}
label{font-weight:bold;font-size:14px}
button{border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:bold;cursor:pointer;background:#e1ebf5;color:var(--navy);margin:3px}
button.primary{background:var(--navy);color:white}
button.danger{background:#fee4e2;color:#a32118}
button:hover{filter:brightness(.96)}
nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
nav button.active{background:var(--navy);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat strong{display:block;font-size:28px;color:var(--blue);margin-top:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0;background:white}
.card h3{margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.status{display:inline-block;background:#e5f2ff;color:#164c7a;padding:5px 9px;border-radius:20px;font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
h2{color:var(--navy)}
h3{color:var(--navy)}
#message{padding:10px;border-radius:8px;margin:10px 0;white-space:pre-wrap}
#message.error{background:#fee4e2;color:#9e1b16}
#message.success{background:#e2f5e9;color:#146c43}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
@media(max-width:600px){header h1{font-size:20px}main{padding:10px}nav button{flex:1}}
</style>
</head>
<body>
<header>
  <h1>✚ SjukhusSystem Sverige</h1>
  <p>Digitalt administrationssystem</p>
</header>

<main>
<div class="notice">
  <strong>Fiktivt övningssystem.</strong>
  Använd endast påhittade personer och uppgifter.
  Systemet är inte avsett för riktig vård, diagnoser eller behandling.
</div>

<div id="message" class="hidden"></div>

<section id="loginPanel" class="panel">
  <h2>Logga in</h2>
  <label>E-post</label>
  <input id="loginEmail" type="email" placeholder="namn@exempel.se">
  <label>Lösenord</label>
  <input id="loginPassword" type="password" placeholder="Lösenord">
  <button class="primary" onclick="login()">Logga in</button>
  <hr>
  <h3>Skapa patientkonto</h3>
  <label>Fullständigt namn</label>
  <input id="regName" placeholder="Förnamn Efternamn">
  <label>E-post</label>
  <input id="regEmail" type="email" placeholder="namn@exempel.se">
  <label>Lösenord</label>
  <input id="regPassword" type="password" minlength="6" placeholder="Minst 6 tecken">
  <button class="primary" onclick="registerPatient()">Skapa patientkonto</button>
</section>

<section id="appPanel" class="hidden">
  <div class="panel">
    <div class="grid">
      <div>
        <strong id="welcome">Välkommen</strong>
        <div class="muted" id="roleText"></div>
      </div>
      <div style="text-align:right">
        <button class="danger" onclick="logout()">Logga ut</button>
      </div>
    </div>
  </div>

  <nav id="navigation"></nav>
  <div id="page"></div>
</section>
</main>

<footer>SjukhusSystem Sverige · Fiktivt övningssystem</footer>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ysddqwzrypohnfyrpynu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tGEZ0WQMWGK3Hj4CMdtAxQ_7AiJHbiR';

const supabase = createClient(SUPABASE_URL,SUPABASE_KEY);

let current = null;
let profile = null;
let patients = [];
let bookings = [];
let staff = [];
let medicines = [];
let labOrders = [];
let labResults = [];
let decisions = [];
let notes = [];
let referrals = [];
let prescriptions = [];
let activePage = 'home';

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function msg(text,type='success') {
  const el=$('message');
  el.textContent=text;
  el.className=type;
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearMsg() {
  $('message').className='hidden';
}

function fail(error) {
  console.error(error);
  msg(error.message || 'Ett fel uppstod. Kontrollera Supabase-inställningarna.','error');
}

async function rows(table) {
  const {data,error}=await supabase.from(table).select('*').order('created_at',{ascending:false});
  if(error) throw error;
  return data || [];
}

async function addRow(table,data) {
  const {error}=await supabase.from(table).insert(data);
  if(error) throw error;
}

async function loadData() {
  try {
    const results=await Promise.all([
      rows('demo_patients'),
      rows('demo_bookings'),
      rows('demo_staff'),
      rows('demo_medicines'),
      rows('demo_lab_orders'),
      rows('demo_lab_results'),
      rows('demo_doctor_decisions'),
      rows('demo_medical_notes'),
      rows('demo_referrals'),
      rows('demo_prescriptions')
    ]);
    [patients,bookings,staff,medicines,labOrders,labResults,
      decisions,notes,referrals,prescriptions]=results;
    return true;
  } catch(e) {
    fail(e);
    return false;
  }
}

async function login() {
  clearMsg();
  const email=$('loginEmail').value.trim();
  const password=$('loginPassword').value;
  if(!email || !password) return msg('Fyll i e-post och lösenord.','error');

  try {
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error) throw error;
    await startApp(data.user);
  } catch(e) { fail(e); }
}

async function registerPatient() {
  clearMsg();
  const name=$('regName').value.trim();
  const email=$('regEmail').value.trim();
  const password=$('regPassword').value;

  if(!name || !email || password.length<6)
    return msg('Fyll i namn, e-post och minst 6 tecken i lösenordet.','error');

  try {
    const {data,error}=await supabase.auth.signUp({
      email,password,
      options:{data:{full_name:name}}
    });
    if(error) throw error;

    if(data.session && data.user) {
      await startApp(data.user);
    } else {
      msg('Kontot är skapat. Kontrollera din e-post för att bekräfta kontot. Om profilen inte skapas automatiskt behöver Supabase konfigureras.');
    }
  } catch(e) { fail(e); }
}

async function startApp(user) {
  current=user;
  const {data,error}=await supabase.from('profiles')
    .select('*').eq('id',user.id).single();
  if(error) throw error;
  if(!data) throw new Error('Ingen användarprofil hittades.');
  profile=data;

  if(!['admin','doctor','patient'].includes(profile.role))
    throw new Error('Kontot har ingen giltig roll.');

  await loadData();

  $('loginPanel').classList.add('hidden');
  $('appPanel').classList.remove('hidden');
  $('welcome').textContent=profile.full_name || user.email;
  $('roleText').textContent='Roll: '+profile.role;
  buildNavigation();
  showPage('home');
}

async function logout() {
  await supabase.auth.signOut();
  current=null;profile=null;
  $('appPanel').classList.add('hidden');
  $('loginPanel').classList.remove('hidden');
}

function isStaff() {
  return profile && ['admin','doctor'].includes(profile.role);
}

function myPatient() {
  return patients.find(p=>p.user_id===current.id);
}

function patientName(id) {
  const p=patients.find(x=>x.id===id);
  return p ? p.full_name : 'Okänd patient';
}

function patientOptions() {
  return patients.map(p=>`<option value="${esc(p.id)}">${esc(p.full_name)} (${esc(p.patient_number || '')})</option>`).join('');
}

function buildNavigation() {
  const items=[['home','Översikt']];
  if(profile.role==='patient') items.push(['mine','Min sida']);
  if(isStaff()) items.push(
    ['patients','Patienter'],['bookings','Bokningar'],
    ['staff','Personal'],['labs','Provbeställningar'],
    ['results','Provsvar'],['decisions','Läkarbedömningar'],
    ['notes','Journalanteckningar'],['referrals','Remisser'],
    ['medicines','Läkemedel'],['prescriptions','Recept']
  );
  $('navigation').innerHTML=items.map(([id,label])=>
    `<button data-page="${id}" onclick="showPage('${id}')">${label}</button>`
  ).join('');
}

function showPage(name) {
  activePage=name;
  document.querySelectorAll('nav button').forEach(b=>
    b.classList.toggle('active',b.dataset.page===name)
  );
  const pages={
    home:homePage,mine:myPage,patients:patientsPage,
    bookings:bookingsPage,staff:staffPage,labs:labsPage,
    results:resultsPage,decisions:decisionsPage,
    notes:notesPage,referrals:referralsPage,
    medicines:medicinesPage,prescriptions:prescriptionsPage
  };
  if(!pages[name]) return;
  $('page').innerHTML=pages[name]();
}

function homePage() {
  const today=new Date().toISOString().slice(0,10);
  const upcoming=bookings.filter(b=>b.booking_date>=today).length;
  return `
  <h2>Översikt</h2>
  <div class="grid">
    ${stat('Patienter',patients.length)}
    ${stat('Kommande bokningar',upcoming)}
    ${stat('Provbeställningar',labOrders.length)}
    ${stat('Provsvar',labResults.length)}
    ${stat('Remisser',referrals.length)}
  </div>
  <div class="panel">
    <h3>Välkommen till systemet</h3>
    <p>Välj en funktion i menyn för att fortsätta.</p>
    <p class="muted">Alla uppgifter ska vara fiktiva.</p>
  </div>`;
}

function stat(label,value) {
  return `<div class="stat">${esc(label)}<strong>${value}</strong></div>`;
}

function myPage() {
  const p=myPatient();
  if(!p) return `<div class="panel"><h2>Min sida</h2><p>Patientprofilen kunde inte hittas. Kontakta systemadministratören.</p></div>`;
  const ownBookings=bookings.filter(b=>b.patient_id===p.id);
  const ownOrders=labOrders.filter(x=>x.patient_id===p.id);
  const ownResults=labResults.filter(x=>x.patient_id===p.id);
  const ownNotes=notes.filter(x=>x.patient_id===p.id);
  const ownReferrals=referrals.filter(x=>x.patient_id===p.id);

  return `
  <h2>Min sida</h2>
  <div class="panel">
    <h3>Patientprofil</h3>
    <p><b>Namn:</b> ${esc(p.full_name)}</p>
    <p><b>Patientnummer:</b> ${esc(p.patient_number)}</p>
    <p><b>Telefon:</b> ${esc(p.phone)}</p>
  </div>
  <div class="panel"><h3>Mina bokningar</h3>${list(ownBookings,b=>`${b.booking_date || ''} ${b.booking_time || ''} – ${b.department || ''}`)}</div>
  <div class="panel"><h3>Mina provbeställningar</h3>${list(ownOrders,b=>`${b.test_name} – ${b.status || ''}`)}</div>
  <div class="panel"><h3>Mina provsvar</h3>${list(ownResults,b=>`${b.test_name}: ${b.result_value} ${b.unit || ''} (${b.status || ''})`)}</div>
  <div class="panel"><h3>Mina anteckningar</h3>${list(ownNotes,b=>`${b.title}: ${b.content}`)}</div>
  <div class="panel"><h3>Mina remisser</h3>${list(ownReferrals,b=>`${b.department}: ${b.reason} – ${b.status || ''}`)}</div>`;
}

function list(items,format) {
  if(!items.length) return '<p class="muted">Inga uppgifter registrerade.</p>';
  return items.map(x=>`<div class="card">${esc(format(x))}</div>`).join('');
}

function patientsPage() {
  return `<h2>Patienter</h2>
  <div class="panel">
    <h3>Registrera fiktiv patient</h3>
    <label>Namn</label><input id="pName">
    <label>Födelsedatum</label><input id="pBirth" type="date">
    <label>Telefon</label><input id="pPhone">
    <label>Anteckning</label><textarea id="pNote"></textarea>
    <button class="primary" onclick="addPatient()">Spara patient</button>
  </div>
  <div class="panel"><h3>Patientlista</h3>${patients.map(p=>`
    <div class="card"><b>${esc(p.full_name)}</b>
    <p>${esc(p.patient_number || '')} · ${esc(p.phone || '')}</p></div>`).join('')}</div>`;
}

async function addPatient() {
  try {
    await addRow('demo_patients',{
      full_name:$('pName').value.trim(),
      birth_date:$('pBirth').value || null,
      phone:$('pPhone').value.trim(),
      demo_note:$('pNote').value.trim()
    });
    await loadData();showPage('patients');msg('Patienten har sparats.');
  } catch(e){fail(e);}
}

function bookingsPage() {
  return `<h2>Bokningar</h2>
  <div class="panel">
    <h3>Skapa bokning</h3>
    <label>Patient</label><select id="bPatient">${patientOptions()}</select>
    <label>Datum</label><input type="date" id="bDate">
    <label>Tid</label><input type="time" id="bTime">
    <label>Avdelning</label><input id="bDepartment">
    <label>Information</label><textarea id="bNote"></textarea>
    <button class="primary" onclick="addBooking()">Spara bokning</button>
  </div>
  <div class="panel"><h3>Alla bokningar</h3>
    ${list(bookings,b=>`${patientName(b.patient_id)} – ${b.booking_date} ${b.booking_time || ''} – ${b.department || ''}`)}
  </div>`;
}

  try {
    await addRow('demo_bookings',{
      patient_id:$('bPatient').value,
      booking_date:$('bDate').value,
      booking_time:$('bTime').value,
      department:$('bDepartment').value,
      note:$('bNote').value
    });
    await loadData();showPage('bookings');msg('Bokningen har sparats.');

}

  <div class="panel">

    <label>Yrkesroll</label><input id="sJob">
    <label>Avdelning</label><input id="sDept">

  </div>
  <div class="panel"><h3>Personalregister</h3>
    ${list(staff,s=>`${s.full_name} – ${s.job_title || ''} – ${s.department || ''}`)}
  </div>`;
}

  try {

    </select>
    <button class="primary" onclick="addLabOrder()">Skapa beställning</button>

}

function prescriptionsPage() {
  return `<h2>Recept</h2>
  <div class="panel">
    <label>Patient</label><select id="rxPatient">${patientOptions()}</select>
    <label>Läkemedel</label><select id="rxMedicine">
      ${medicines.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} – ${esc(m.strength || '')}</option>`).join('')}
    </select>
    <label>Dosering (övning)</label><input id="rxDosage">
    <label>Behandlingstid (övning)</label><input id="rxDuration">
    <label>Antal</label><input id="rxQuantity" type="number">
    <label>Status</label><select id="rxStatus"><option>Utkast</option><option>Avslutat</option></select>
    <button class="primary" onclick="addPrescription()">Spara recept</button>
  </div>
  <div class="panel"><h3>Receptlista</h3>
    ${list(prescriptions,x=>`${patientName(x.patient_id)} – ${medicines.find(m=>m.id===x.medicine_id)?.name || 'Läkemedel'} – ${x.status || ''}`)}
  </div>`;
}

async function addPrescription() {
  try {
    await addRow('demo_prescriptions',{
      patient_id:$('rxPatient').value,
      doctor_id:current.id,
      medicine_id:$('rxMedicine').value,
      demo_dosage:$('rxDosage').value,
      demo_duration:$('rxDuration').value,
      quantity:Number($('rxQuantity').value),
      status:$('rxStatus').value
    });
    await loadData();showPage('prescriptions');msg('Receptet har sparats.');
  } catch(e){fail(e);}
}

Object.assign(window,{
  login,registerPatient,logout,showPage,
  addPatient,addBooking,addStaff,addLabOrder,
  addResult,addDecision,addNote,addReferral,
  addMedicine,addPrescription
});

const {data:{session}}=await supabase.auth.getSession();
if(session?.user) {
  try { await startApp(session.user); }
  catch(e) { fail(e); }
}
</script>
